<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="机器是如何识别数字：猜数字游戏、手写数字识别原理探究、模型训练、测试准确率记录，四个互动页面集成导航。">
<title>机器是如何识别数字 · 互动课堂</title>
<style>
  :root{
    --nav-h: 62px;
    --navy: #10233f;
    --navy-deep: #071a35;
    --teal: #13b8a6;
    --teal-deep: #0b7f83;
    --ink: #10233f;
    --muted: #5d6f86;
    --line: #dde5ee;
    --paper: #f4f7fb;
    --card: #ffffff;
    --shadow: 0 6px 20px rgba(16,35,63,.08);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:var(--font);
    color:var(--ink);
    background:var(--paper);
    overflow:hidden;
  }

  /* ---------- 顶部导航 ---------- */
  .topbar{
    position:fixed; top:0; left:0; right:0; height:var(--nav-h);
    z-index:20;
    display:flex; align-items:center; gap:18px;
    padding:0 18px;
    background:var(--card);
    border-bottom:1px solid var(--line);
    box-shadow:var(--shadow);
  }
  .brand{display:flex; align-items:center; gap:11px; flex:0 0 auto;}
  .brand-mark{
    width:38px; height:38px; border-radius:11px; flex:0 0 auto;
    background:linear-gradient(140deg,var(--teal) 0%,var(--teal-deep) 100%);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 10px rgba(19,184,166,.35);
  }
  .brand-mark svg{width:22px; height:22px; display:block;}
  .brand-text{display:flex; flex-direction:column; line-height:1.25;}
  .brand-title{margin:0; font-size:15px; font-weight:700; color:var(--navy); letter-spacing:.2px;}
  .brand-sub{font-size:11.5px; color:var(--muted);}

  .tabs{
    flex:1 1 auto; min-width:0;
    display:flex; align-items:center; gap:6px;
    overflow-x:auto; overflow-y:hidden;
    scrollbar-width:none;
    padding:2px;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;
    display:inline-flex; align-items:center; gap:8px;
    height:40px; padding:0 15px;
    border:1px solid transparent; border-radius:10px;
    background:transparent; color:var(--muted);
    font-family:inherit; font-size:14px; font-weight:600;
    cursor:pointer; white-space:nowrap;
    transition:background .18s ease, color .18s ease, border-color .18s ease;
  }
  .tab .idx{
    display:inline-flex; align-items:center; justify-content:center;
    width:20px; height:20px; border-radius:6px;
    background:#eef2f7; color:var(--muted);
    font-size:12px; font-weight:700;
    transition:background .18s ease, color .18s ease;
  }
  .tab:hover{background:#f2f6fa; color:var(--navy);}
  .tab:hover .idx{background:#e3ebf3;}
  .tab.is-active{
    background:#e8f7f5; color:var(--teal-deep);
    border-color:#bfeee8;
  }
  .tab.is-active .idx{background:var(--teal); color:#fff;}
  .tab:focus-visible{outline:2px solid var(--teal); outline-offset:2px;}

  .actions{flex:0 0 auto; display:flex; align-items:center; gap:8px;}
  .ghost-link{
    display:inline-flex; align-items:center; gap:6px;
    height:36px; padding:0 13px; border-radius:9px;
    border:1px solid var(--line); background:#fff; color:var(--muted);
    font-size:13px; font-weight:600; text-decoration:none;
    transition:color .18s ease, border-color .18s ease, background .18s ease;
  }
  .ghost-link:hover{color:var(--teal-deep); border-color:#bfeee8; background:#f7fffe;}
  .ghost-link svg{width:14px; height:14px;}

  /* ---------- 内容舞台 ---------- */
  #stage{
    position:fixed; top:var(--nav-h); left:0; right:0; bottom:0;
    background:var(--paper);
  }
  .page{position:absolute; inset:0; display:none;}
  .page.is-active{display:block;}
  .page iframe{
    display:block; width:100%; height:100%; border:0; background:#fff;
  }

  /* ---------- 加载指示 ---------- */
  .loading{
    position:absolute; inset:0; z-index:5;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
    background:var(--paper);
    color:var(--muted); font-size:13.5px;
  }
  .loading[hidden]{display:none;}
  .spinner{
    width:28px; height:28px; border-radius:50%;
    border:3px solid #dbe5ef; border-top-color:var(--teal);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- 窄屏适配 ---------- */
  @media (max-width: 860px){
    :root{--nav-h:58px;}
    .brand-sub{display:none;}
    .brand-text{display:none;}
    .ghost-link span{display:none;}
    .ghost-link{padding:0 10px;}
  }
  @media (max-width: 600px){
    .topbar{padding:0 10px; gap:10px;}
    .tab{padding:0 11px; font-size:13px;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="3" width="16" height="18" rx="3"></rect>
        <path d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4"></path>
      </svg>
    </div>
    <div class="brand-text">
      <h1 class="brand-title">机器是如何识别数字</h1>
      <span class="brand-sub">互动课堂 · 4 个活动页面</span>
    </div>
  </div>

  <nav class="tabs" id="tabs" aria-label="页面导航">
    <button class="tab is-active" type="button" data-page="p1" aria-current="page">
      <span class="idx">1</span>猜数字游戏
    </button>
    <button class="tab" type="button" data-page="p2">
      <span class="idx">2</span>手写数字识别原理探究
    </button>
    <button class="tab" type="button" data-page="p3">
      <span class="idx">3</span>手写数字识别模型训练
    </button>
    <button class="tab" type="button" data-page="p4">
      <span class="idx">4</span>模型测试准确率记录
    </button>
  </nav>

  <div class="actions">
    <a class="ghost-link" id="openNew" href="1猜数字游戏.html" target="_blank" rel="noopener" title="在新窗口打开当前页面">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14 4h6v6"></path><path d="M20 4l-8.5 8.5"></path>
        <path d="M18 14.5V18a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3.5"></path>
      </svg>
      <span>新窗口打开</span>
    </a>
  </div>
</header>

<main id="stage">
  <section class="page is-active" id="p1">
    <div class="loading" hidden><div class="spinner"></div><span>正在加载「猜数字游戏」…</span></div>
    <iframe data-src="1猜数字游戏.html" title="猜数字游戏"></iframe>
  </section>
  <section class="page" id="p2">
    <div class="loading" hidden><div class="spinner"></div><span>正在加载「手写数字识别原理探究」…</span></div>
    <iframe data-src="2手写数字识别原理探究.html" title="手写数字识别原理探究"></iframe>
  </section>
  <section class="page" id="p3">
    <div class="loading" hidden><div class="spinner"></div><span>正在加载「手写数字识别模型训练」…</span></div>
    <iframe data-src="3手写数字识别模型训练.html" title="手写数字识别模型训练"></iframe>
  </section>
  <section class="page" id="p4">
    <div class="loading" hidden><div class="spinner"></div><span>正在加载「模型测试准确率记录」…</span></div>
    <iframe data-src="4模型测试准确率记录.html" title="模型测试准确率记录"></iframe>
  </section>
</main>

<script>
(function () {
  'use strict';

  var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  var openNew = document.getElementById('openNew');
  var order = tabs.map(function (t) { return t.dataset.page; });
  var current = order[0];

  function section(id) { return document.getElementById(id); }
  function frame(id) { return section(id).querySelector('iframe'); }
  function loader(id) { return section(id).querySelector('.loading'); }

  // 首次进入某个页面时才加载 iframe，之后保持存活 —— 切回来时进度与状态不丢失
  function showHint(lg) {
    lg.hidden = false;
    lg.innerHTML = '<div style="max-width:520px;text-align:center;line-height:1.8;color:#b54a4a">' +
      '当前页面未能加载。<br>请确认 <b>index.html</b> 与 4 个网页文件放在同一个文件夹中。' +
      '<br>若浏览器禁止本地文件嵌套显示，可在本文件夹执行 <code>python -m http.server 8000</code>，' +
      '再访问 <code>http://localhost:8000/index.html</code>。</div>';
  }

  function ensureLoaded(id) {
    var f = frame(id);
    if (f.getAttribute('src')) { return; }
    var lg = loader(id);
    lg.hidden = false;
    f.addEventListener('error', function () { showHint(lg); });
    f.addEventListener('load', function () { f.dataset.loaded = '1'; lg.hidden = true; });
    // 兜底：若浏览器禁止 file:// 下的 iframe 嵌套，给出明确指引
    setTimeout(function () {
      if (!f.dataset.loaded) { showHint(lg); }
    }, 8000);
    f.src = f.dataset.src;
  }

  function activate(id, updateHash) {
    if (!section(id)) { id = order[0]; }
    current = id;

    tabs.forEach(function (t) {
      var on = t.dataset.page === id;
      t.classList.toggle('is-active', on);
      if (on) { t.setAttribute('aria-current', 'page'); }
      else { t.removeAttribute('aria-current'); }
    });

    order.forEach(function (pid) {
      section(pid).classList.toggle('is-active', pid === id);
    });

    ensureLoaded(id);
    openNew.href = frame(id).getAttribute('src') || frame(id).dataset.src;

    if (updateHash !== false) {
      if (location.hash !== '#' + id) { history.replaceState(null, '', '#' + id); }
    }
  }

  tabs.forEach(function (t) {
    t.addEventListener('click', function () { activate(t.dataset.page); });
    // 左右方向键在标签间移动
    t.addEventListener('keydown', function (e) {
      var i = order.indexOf(t.dataset.page);
      if (e.key === 'ArrowRight' && i < order.length - 1) { tabs[i + 1].focus(); tabs[i + 1].click(); }
      if (e.key === 'ArrowLeft' && i > 0) { tabs[i - 1].focus(); tabs[i - 1].click(); }
    });
  });

  window.addEventListener('hashchange', function () {
    var id = location.hash.replace('#', '');
    if (order.indexOf(id) !== -1 && id !== current) { activate(id, false); }
  });

  // 支持 Ctrl + 1~4 快速切换
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey && /^[1-4]$/.test(e.key)) {
      e.preventDefault();
      activate(order[Number(e.key) - 1]);
    }
  });

  var start = location.hash.replace('#', '');
  activate(order.indexOf(start) !== -1 ? start : order[0], false);
})();
</script>
</body>
</html>
