  &lt;style&gt;
    *{box-sizing:border-box}
    :root{--bg:#eef5f8;--navy:#173f6b;--teal:#10b7a9;--teal-deep:#087f83;--card:#f9fcfd;--line:#cbddeb;--soft:#e5f1f7;--muted:#6f8499}
    html,body{min-width:320px;margin:0;background:var(--bg);color:var(--navy);font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,Arial,sans-serif}
    body{min-height:100vh}
    button,input{font:inherit}button{cursor:pointer}
    .page{width:min(900px,calc(100% - 32px));margin:0 auto;padding:42px 0 64px}
    .hero{display:flex;align-items:center;gap:22px;padding:0 18px 28px}
    .hero-icon{position:relative;width:76px;height:76px;flex:0 0 76px;border:7px solid var(--teal-deep);border-radius:28px;background:var(--teal);box-shadow:7px 7px 0 #e4d8c5}
    .hero-icon:before{content:&quot;&quot;;position:absolute;width:25px;height:25px;border:5px solid var(--navy);border-radius:50%;left:19px;top:14px;background:#dcebf5}
    .hero-icon:after{content:&quot;&quot;;position:absolute;width:25px;height:7px;border-radius:7px;background:var(--navy);transform:rotate(45deg);left:39px;top:46px}
    .hero h1{margin:0;color:var(--teal);font-size:clamp(34px,7vw,68px);line-height:1.08;letter-spacing:-.04em;font-weight:900}
    .hero p{margin:10px 0 0;color:#617b9a;font-size:clamp(18px,3vw,28px);font-weight:700}
    .main-card{border:3px solid var(--line);border-radius:34px;background:rgba(249,252,253,.86);padding:30px 40px 38px;box-shadow:0 10px 28px rgba(62,103,135,.08)}
    .section-title{display:flex;align-items:center;gap:18px;color:var(--teal);font-size:clamp(26px,4vw,42px);font-weight:900;border-bottom:3px dashed #c8dbe9;padding:0 0 20px;margin-bottom:18px}
    .section-icon{width:58px;height:58px;position:relative;flex:0 0 58px}
    .section-icon:before{content:&quot;&quot;;position:absolute;width:34px;height:34px;border:6px solid var(--navy);border-radius:50%;left:3px;top:1px}
    .section-icon:after{content:&quot;&quot;;position:absolute;width:25px;height:8px;border-radius:8px;background:var(--navy);transform:rotate(45deg);left:35px;top:39px}
    .student-card,.accuracy-card{display:grid;grid-template-columns:118px 1fr;align-items:center;gap:24px;background:#fff;border:3px solid #d6e7f2;border-radius:28px;padding:22px 24px;margin:14px 0;min-height:116px}
    .accuracy-card:nth-of-type(3){background:#f7fbfd}
    .badge{width:82px;height:82px;border-radius:24px;background:#d8eaf6;display:flex;align-items:center;justify-content:center;color:var(--navy);font-size:36px;font-weight:900}
    .student-card label,.accuracy-card label{display:block;color:#5d7898;font-size:19px;font-weight:800;margin-bottom:7px}
    .student-card input,.accuracy-card input{width:100%;height:54px;border:2px solid #bcd3e4;border-radius:16px;padding:8px 16px;background:#fff;color:var(--navy);font-size:26px;font-weight:800;outline:none}
    .student-card input:focus,.accuracy-card input:focus{border-color:var(--teal);box-shadow:0 0 0 4px rgba(16,183,169,.16)}
    .accuracy-card .label-title{color:var(--navy);font-size:28px;font-weight:900;line-height:1.2}
    .input-with-unit{display:grid;grid-template-columns:1fr 32px;align-items:center;gap:10px}
    .unit{font-size:26px;font-weight:900;color:var(--navy)}
    .actions{margin-top:22px}
    .status{min-height:26px;color:var(--navy);font-size:16px;font-weight:700;margin-bottom:10px}
    .status.error{color:#8b2635}
    .submit-btn,.reset-btn{width:100%;min-height:64px;border:3px solid var(--teal-deep);border-radius:22px;background:var(--teal);color:#001d2e;font-size:27px;font-weight:900;box-shadow:0 3px 0 var(--teal-deep)}
    .submit-btn:active,.reset-btn:active{transform:translateY(2px);box-shadow:none}
    .submit-btn:disabled{opacity:.55;cursor:not-allowed}
    .success-panel{display:none;border:3px solid var(--line);border-radius:34px;padding:42px;background:var(--card);text-align:center;color:var(--navy)}
    .success-panel.show{display:block}
    .success-panel p{margin:0 0 24px;font-size:30px;font-weight:900;color:var(--teal)}
    .hidden{display:none!important}
    @media(max-width:600px){.page{width:calc(100% - 20px);padding:22px 0 42px}.hero{align-items:flex-start;gap:14px;padding:0 8px 20px}.hero-icon{width:58px;height:58px;flex-basis:58px;border-width:5px;border-radius:20px;box-shadow:5px 5px 0 #e4d8c5}.hero-icon:before{width:19px;height:19px;border-width:4px;left:14px;top:11px}.hero-icon:after{width:20px;height:6px;left:31px;top:36px}.hero h1{font-size:34px}.hero p{font-size:17px;margin-top:6px}.main-card{padding:20px 14px 24px;border-radius:26px}.section-title{font-size:28px;gap:10px;padding-bottom:14px}.section-icon{transform:scale(.8);transform-origin:left center;margin-right:-8px}.student-card,.accuracy-card{grid-template-columns:66px 1fr;gap:12px;padding:14px 12px;border-radius:22px;min-height:104px}.badge{width:58px;height:58px;border-radius:18px;font-size:27px}.student-card label,.accuracy-card label{font-size:15px}.accuracy-card .label-title{font-size:21px}.student-card input,.accuracy-card input{height:48px;border-radius:13px;font-size:22px;padding:6px 12px}.unit{font-size:22px}.submit-btn,.reset-btn{min-height:58px;border-radius:18px;font-size:23px}}
  &lt;/style&gt;

      &lt;div class=&quot;accuracy-card&quot;&gt;&lt;div class=&quot;badge&quot;&gt;1&lt;/div&gt;&lt;div&gt;&lt;label for=&quot;accuracy1&quot;&gt;第一次&lt;/label&gt;&lt;div class=&quot;label-title&quot;&gt;5张样本准确率&lt;/div&gt;&lt;div class=&quot;input-with-unit&quot;&gt;&lt;input id=&quot;accuracy1&quot; name=&quot;accuracy1&quot; type=&quot;number&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;0.1&quot; inputmode=&quot;decimal&quot; required /&gt;&lt;span class=&quot;unit&quot;&gt;%&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;accuracy-card&quot;&gt;&lt;div class=&quot;badge&quot;&gt;2&lt;/div&gt;&lt;div&gt;&lt;label for=&quot;accuracy2&quot;&gt;第二次&lt;/label&gt;&lt;div class=&quot;label-title&quot;&gt;增加10张样本后准确率&lt;/div&gt;&lt;div class=&quot;input-with-unit&quot;&gt;&lt;input id=&quot;accuracy2&quot; name=&quot;accuracy2&quot; type=&quot;number&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;0.1&quot; inputmode=&quot;decimal&quot; required /&gt;&lt;span class=&quot;unit&quot;&gt;%&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;

    &lt;/form&gt;

  &lt;/main&gt;
  &lt;script&gt;
    (function(){
      var COLLECTION='accuracy_submissions';
      var form=document.getElementById('accuracyForm'),statusEl=document.getElementById('status'),submitBtn=document.getElementById('submitBtn'),successPanel=document.getElementById('successPanel');
      function setStatus(message,kind){statusEl.textContent=message||'';statusEl.className='status '+(kind||'');}
      function valueOf(id){return document.getElementById(id).value.trim();}
      function accuracyValue(id){var n=Number(valueOf(id));return Number.isFinite(n)?n:null;}
      function validate(){
        var sid=valueOf('studentId'),a1=accuracyValue('accuracy1'),a2=accuracyValue('accuracy2'),a3=accuracyValue('accuracy3');
        if(!/^[0-9]{2}$/.test(sid))return '请输入2位数字学号。';
        for(var i=0;i&lt;3;i++){var v=[a1,a2,a3][i];if(v===null||v&lt;0||v&gt;100)return '请填写0到100之间的准确率。';}
        return null;
      }
      form.addEventListener('submit',async function(event){
        event.preventDefault();var error=validate();if(error){setStatus(error,'error');return;}
        submitBtn.disabled=true;setStatus('');
        try{
          var runtimeInstanceId=new URLSearchParams(window.top.location.search).get('instanceId');
          var sdk=await window.MuskCollectLoader.getInstance(runtimeInstanceId||undefined);
          await sdk.save(COLLECTION,{studentId:valueOf('studentId'),accuracy1:accuracyValue('accuracy1'),accuracy2:accuracyValue('accuracy2'),accuracy3:accuracyValue('accuracy3'),submittedAt:Date.now()});
          form.classList.add('hidden');successPanel.classList.add('show');
        }catch(err){setStatus((err&amp;&amp;err.message)||'提交失败。','error');submitBtn.disabled=false;}
      });
      document.getElementById('resetBtn').addEventListener('click',function(){form.reset();form.classList.remove('hidden');successPanel.classList.remove('show');submitBtn.disabled=false;setStatus('');window.scrollTo({top:0,behavior:'smooth'});});
    })();
  &lt;/script&gt;
